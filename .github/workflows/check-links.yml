name: Vault checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install checker dependencies
        run: python -m pip install -r .scripts/requirements.txt
      - name: Test vault checkers
        id: tests
        run: python -m unittest discover -s .scripts -p 'test_*.py'
      - name: Check vault links
        run: python .scripts/check_links.py
      - name: Validate note properties
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: python .scripts/check_properties.py
      - name: Check same-domain MOC coverage
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: python .scripts/check_moc_coverage.py
